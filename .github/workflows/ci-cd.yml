name: CI / CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # Allow manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Cancel old run if a new push comes in

# ── Shared image name ────────────────────────────────────────────────
env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/nrw-admin

jobs:

  # ── Job 1: Build Docker image & push to DockerHub ─────────────────
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}   # Pass SHA tag to deploy job

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Generate a short SHA tag for traceability & rollback ───────
      - name: Generate image tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── Login to DockerHub ─────────────────────────────────────────
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   # Use an Access Token, not your password

      # ── Build multi-stage image (Node build happens INSIDE Docker) ─
      # No need for npm ci / npm run build here — Dockerfile handles it
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      # ── Push both tags: SHA (rollback) + latest (prod) ────────────
      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Image summary
        run: |
          echo "## 🐳 Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY


  # ── Job 2: Deploy to VPS ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Copy the prod compose file to VPS ─────────────────────────
      # VPS needs docker-compose.prod.yml — it doesn't pull source code
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source:   "docker-compose.prod.yml"
          target:   "/root/admin"

      # ── SSH into VPS and deploy ────────────────────────────────────
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /root/admin

            echo "🚀 Deploying ${{ needs.build-and-push.outputs.image_tag }}..."

            # Pull the latest image from DockerHub
            docker compose -f docker-compose.prod.yml pull

            # Restart with new image, remove orphan containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait and verify container is healthy
            # echo "Waiting for health check..."
            # for i in $(seq 1 12); do
            #   STATUS=$(docker inspect --format='{{.State.Health.Status}}' nrw_admin 2>/dev/null || echo "starting")
            #   echo "  [$i/12] Status: $STATUS"
            #   if [ "$STATUS" = "healthy" ]; then
            #     echo "✅ Container is healthy"
            #     break
            #   fi
            #   if [ $i -eq 12 ]; then
            #     echo "❌ Health check failed — rolling back to previous image"
            #     docker compose -f docker-compose.prod.yml down
            #     exit 1
            #   fi
            #   sleep 5
            # done

            # Clean up old dangling images
            docker image prune -f

            echo "✅ Deployment complete: ${{ needs.build-and-push.outputs.image_tag }}"
